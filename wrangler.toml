name = "oh8oh"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Main entry point for Workers
main = ".output/server/index.mjs"

# Account ID
account_id = "83d4d6746ea272718c8c962ecf89a8cb"

# R2 Bucket for image uploads and static assets
[[r2_buckets]]
binding = "R2"
bucket_name = "event-app"

# Browser Rendering API for web scraping
[browser]
binding = "BROWSER"

# Cron Triggers — run the full scrape (incl. Puppeteer sources) daily.
# Cron is in UTC: 21:30 UTC = 03:00 IST (early morning, low traffic in Bangalore).
# Handled by the scheduled() Worker export via the scheduled-scrape Nitro plugin.
[triggers]
crons = ["30 21 * * *"]

# Environment variables
[vars]
ENVIRONMENT = "production"
# Public base URL of the R2 bucket — prefixed onto uploaded image keys so the
# stored image URL is absolute (without it, uploads save a bare "events/x.jpg").
R2_PUBLIC_URL = "https://pub-bed71a8733274489a8ed2376a7183934.r2.dev"

# Asset configuration for serving frontend files
[assets]
directory = ".output/public"
binding = "ASSETS"

# Secrets (set via: wrangler secret put SECRET_NAME)
# - SESSION_SECRET
# - BETTER_AUTH_SECRET
# - BETTER_AUTH_URL (your production URL)
